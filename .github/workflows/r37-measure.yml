# TEMPORARY — roadmap R37 measurement scaffolding. Delete before the PR merges.
#
# Re-measures the per-run byte-loss rate of the UNFIXED writer through a pipe on
# the current CI runner, because tests/fidelity/exit-flush.test.ts's vacuity guard
# went red on PR #23 and its docblock says: re-measure, do not "fix".
name: R37 measurement (temporary)

on:
  push:
    branches:
      - test/r37-exit-flush-vacuity-guard
  workflow_dispatch:

jobs:
  measure:
    name: R37 — loss-rate distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'

      - uses: actions/setup-node@v5
        with:
          node-version: '24.15.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Runner identity
        run: |
          echo "ImageOS=$ImageOS  ImageVersion=$ImageVersion"
          echo "runner-arch=$RUNNER_ARCH"
          uname -a
          node --version
          nproc
          echo "pipe-max-size: $(cat /proc/sys/fs/pipe-max-size)"
          cat /proc/cpuinfo | grep -m1 'model name'
          free -m | head -2

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Probe distribution (standalone parent)
        run: |
          cat > /tmp/measure.mjs <<'EOF'
          import { spawnSync } from 'node:child_process'
          import { execPath } from 'node:process'

          const PROBE = 'tests/fidelity/exit-flush-probe.mjs'
          const PAYLOAD = 200_000

          function runProbe(args) {
            const r = spawnSync(execPath, [PROBE, ...args], {
              encoding: 'utf8',
              maxBuffer: 16 * 1024 * 1024,
              timeout: 30_000,
            })
            if (r.error) throw r.error
            if (r.signal) throw new Error(`probe killed by ${r.signal}`)
            const stream = args.includes('--fd=1') ? r.stdout : r.stderr
            return { report: stream.split('P').length - 1, status: r.status }
          }

          const CASES = [
            ['console, no prefill  <-- THE GUARD', ['console', String(PAYLOAD), '1', '--fd=2'], 300],
            ['console, warm', ['console', String(PAYLOAD), '1', '--fd=2', '--warm'], 100],
            ['console, prefill 64K', ['console', String(PAYLOAD), '1', '--fd=2', '--prefill=65536'], 100],
            ['bare fs.writeSync, warm', ['writeSync', String(PAYLOAD), '1', '--fd=2', '--warm'], 100],
            ['syncConsole (the fix)', ['sync', String(PAYLOAD), '1', '--fd=2'], 100],
          ]

          for (const [label, args, n] of CASES) {
            const reports = []
            const t0 = Date.now()
            for (let i = 0; i < n; i++) reports.push(runProbe(args).report)
            const ms = Date.now() - t0
            const lost = reports.filter((b) => b < PAYLOAD).length
            const hist = new Map()
            for (const b of reports) hist.set(b, (hist.get(b) ?? 0) + 1)
            const rows = [...hist.entries()].sort((a, b) => b[0] - a[0])
            console.log(`\n=== ${label} — n=${n}, ${ms}ms ===`)
            console.log(`lost bytes in ${lost}/${n} runs  => per-run loss rate p = ${(lost / n).toFixed(4)}`)
            console.log(`min=${Math.min(...reports)} max=${Math.max(...reports)}`)
            for (const [bytes, count] of rows) console.log(`  ${String(bytes).padStart(7)} : ${count}`)
            console.log(`  first 20 runs: ${reports.slice(0, 20).join(',')}`)
          }
          EOF
          node /tmp/measure.mjs

      - name: Guard outcome under the real runner (vitest, 15 repeats)
        run: |
          fails=0
          for i in $(seq 1 15); do
            if pnpm exec vitest run tests/fidelity/exit-flush.test.ts --reporter=dot >/tmp/v.log 2>&1; then
              echo "run $i: PASS"
            else
              fails=$((fails+1))
              echo "run $i: FAIL"
              grep -E "shape the fix rejects|AssertionError|expected" /tmp/v.log | head -5
            fi
          done
          echo "=== exit-flush.test.ts failed $fails / 15 runs ==="

      - name: Probe distribution INSIDE vitest (contended, as the suite sees it)
        run: |
          cat > /tmp/inside.test.ts <<'EOF'
          import { spawnSync } from 'node:child_process'
          import { execPath } from 'node:process'
          import { fileURLToPath } from 'node:url'
          import { expect, it } from 'vitest'

          const PROBE = fileURLToPath(new URL('./exit-flush-probe.mjs', import.meta.url))
          const PAYLOAD = 200_000

          it('measures inside vitest', () => {
            const reports: number[] = []
            for (let i = 0; i < 200; i++) {
              const r = spawnSync(execPath, [PROBE, 'console', String(PAYLOAD), '1', '--fd=2'], {
                encoding: 'utf8',
                maxBuffer: 16 * 1024 * 1024,
                timeout: 30_000,
              })
              reports.push(r.stderr.split('P').length - 1)
            }
            const lost = reports.filter((b) => b < PAYLOAD).length
            const hist = new Map<number, number>()
            for (const b of reports) hist.set(b, (hist.get(b) ?? 0) + 1)
            console.log(`INSIDE VITEST: lost ${lost}/200  p=${(lost / 200).toFixed(4)}`)
            for (const [bytes, count] of [...hist.entries()].sort((a, b) => b[0] - a[0])) {
              console.log(`  ${bytes} : ${count}`)
            }
            expect(reports.length).toBe(200)
          }, 300_000)
          EOF
          cp /tmp/inside.test.ts tests/fidelity/zz-r37-inside.test.ts
          pnpm exec vitest run tests/fidelity/zz-r37-inside.test.ts 2>&1 | tail -40
          rm tests/fidelity/zz-r37-inside.test.ts

      - name: Full suite runtime (§6 budget check)
        run: |
          for i in 1 2 3; do
            start=$(date +%s)
            pnpm test >/tmp/full.log 2>&1 && r=PASS || r=FAIL
            echo "full pnpm test run $i: $r in $(( $(date +%s) - start ))s"
          done
